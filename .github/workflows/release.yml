name: Release

on:
  push:
    branches:
      - release

jobs:
  run_test_suite_workflow:
    uses: ./.github/workflows/test_suite.yml
    with:
      branch: release

  setup_poetry_and_publish_to_pypi:
    runs-on: ubuntu-latest
    needs: run_test_suite_workflow
    steps:
      - name: Checkout code on release
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The package requires python >=3.11; pin the builder instead of
          # inheriting whatever ubuntu-latest ships.
          python-version: "3.12"

      - name: Install Poetry
        run: |
          python -m pip install --upgrade pip
          pip install "poetry==2.5.1"

      - name: Configure GITHUB_TOKEN for Poetry
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies from the committed lock file
        run: poetry install --no-root --with dev

      # Fail fast and readably when the version in pyproject.toml is already on
      # PyPI: `poetry publish` would otherwise wait for a confirmation prompt it
      # can never get in CI, or die with an opaque 400 from the index.
      - name: Check the version is not already published
        run: |
          version=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['tool']['poetry']['version'])")
          echo "locast version in pyproject.toml: ${version}"
          if curl -fsS --max-time 15 "https://pypi.org/pypi/locast/${version}/json" >/dev/null 2>&1; then
            echo "::error::locast ${version} is already on PyPI - bump the version in pyproject.toml before releasing"
            exit 1
          fi
          echo "not published yet - proceeding"

      - name: Build Python package and publish to PyPI
        if: ${{ needs.run_test_suite_workflow.result == 'success' }}
        env:
          PYPI_LOCAST_TOKEN: ${{ secrets.PYPI_LOCAST_TOKEN }}
        run: poetry publish --build --no-interaction -u __token__ -p "$PYPI_LOCAST_TOKEN"
